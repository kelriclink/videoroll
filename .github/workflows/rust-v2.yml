name: Rust VideoRoll 2.0 control-plane checks

on:
  push:
    branches:
      - rewrite/rust-v2
  pull_request:
    paths:
      - 'rust/**'
      - 'src/web/**'
      - '.github/workflows/rust-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all --locked
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and test React
        run: npm run lint && npm run test
      - name: Typecheck and production bundle
        env:
          VITE_RUST_V2_UI: 'true'
        run: npm run build

  isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify runtime requirements
        run: docker version && ffmpeg -version && ffprobe -version
      - name: Full disposable PostgreSQL + synthetic video flow
        run: bash rust/scripts/smoke-isolated.sh
