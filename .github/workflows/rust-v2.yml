name: Rust VideoRoll 2.0 control-plane checks

on:
  push:
    branches:
      - rewrite/rust-v2
  pull_request:
    paths:
      - 'rust/**'
      - 'src/web/**'
      - '.github/workflows/rust-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --all --locked
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and test React
        run: npm run lint && npm run test
      - name: Typecheck and production bundle
        env:
          VITE_RUST_V2_UI: 'true'
        run: npm run build

  isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated comparison dependencies
        run: |
          python -m pip install -c requirements.lock -e ".[dev,dubbing]"
          npm install --prefix "$RUNNER_TEMP/vr-smoke-node" --no-save --package-lock=false --no-audit --no-fund ws@8.18.3
          echo "VIDEOROLL_V2_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/vr-smoke-node/node_modules" >> "$GITHUB_ENV"
      - name: Install FFmpeg and verify runtime requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          docker version && ffmpeg -version && ffprobe -version
      - name: Fetch locked Rust dependencies for offline smoke commands
        run: cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: Full disposable PostgreSQL + synthetic video flow
        run: bash rust/scripts/smoke-isolated.sh
