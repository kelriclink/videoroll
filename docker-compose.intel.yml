services:
  ffplayout:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${INTEL_GPU_RENDER_GID:-992}"
  orchestrator:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${INTEL_GPU_RENDER_GID:-992}"
    environment:
      INTEL_GPU_RENDER_DEVICE: ${INTEL_GPU_RENDER_DEVICE:-/dev/dri/renderD128}
  subtitle-service:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${INTEL_GPU_RENDER_GID:-992}"
    environment:
      INTEL_GPU_RENDER_DEVICE: ${INTEL_GPU_RENDER_DEVICE:-/dev/dri/renderD128}
  subtitle-worker:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${INTEL_GPU_RENDER_GID:-992}"
    environment:
      CELERY_SUB_CONCURRENCY_CAP: ${CELERY_SUB_CONCURRENCY_CAP:-1}
  render-worker:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${INTEL_GPU_RENDER_GID:-992}"
    environment:
      RENDER_WORKER_BACKEND: auto
      RENDER_WORKER_GPU_DEVICE: ""
