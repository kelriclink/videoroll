[package]
name = "videoroll-render-worker"
version = "0.1.0"
edition = "2021"
description = "Native Windows render worker for VideoRoll"
license = "Proprietary"

[[bin]]
name = "VideoRollRenderWorker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
