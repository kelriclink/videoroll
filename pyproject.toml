[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "videoroll"
version = "0.1.0"
description = "Modular video processing pipeline (compliance-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Production direct dependencies are pinned to the versions validated in the
  # release image. Update these deliberately as one tested dependency bump.
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "cryptography==50.0.1",
  "huggingface-hub==1.21.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.5",
  "httpx[socks]==0.28.1",
  "python-multipart==0.0.32",
  "Pillow==12.3.0",
  "celery==5.6.3",
  "redis==8.1.0",
  "defusedxml==0.7.1",
  "yt-dlp[default]==2026.8.19",
  "deno==2.9.6",
  "sentence-transformers==6.0.1",
  "optimum-intel[openvino]==2.1.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper==1.2.1",
  "openvino-genai==2026.4.0.0",
]
dev = [
  "hatchling>=1.25.0",
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/videoroll"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "videoroll/_migration/alembic.ini"
"migrations" = "videoroll/_migration/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
