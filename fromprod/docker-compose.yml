x-core-build: &core-build
  context: .
  dockerfile: Dockerfile
  args:
    INSTALL_SUBTITLE: "0"
    INSTALL_ASR: "0"
    YTDLP_VERSION: ${YTDLP_VERSION:-2026.8.19}
    APP_UID: ${APP_UID:-10001}
    APP_GID: ${APP_GID:-10001}

x-subtitle-build: &subtitle-build
  context: .
  dockerfile: Dockerfile
  args:
    INSTALL_SUBTITLE: "1"
    INSTALL_ASR: ${INSTALL_ASR:-1}
    YTDLP_VERSION: ${YTDLP_VERSION:-2026.8.19}
    APP_UID: ${APP_UID:-10001}
    APP_GID: ${APP_GID:-10001}

x-application-security: &application-security
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  init: true
  dns:
    - "1.1.1.1"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-internal-environment: &internal-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STORAGE_ROOT: ${STORAGE_ROOT:-/storage/objects}
  TMPDIR: ${TMPDIR:-/storage/.partial}
  DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
  ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?ADMIN_BOOTSTRAP_SECRET must be set}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  EGRESS_GATEWAY_URL: http://egress-gateway:8020
  ORCHESTRATOR_URL: http://orchestrator:8000

x-subtitle-environment: &subtitle-environment
  <<: *internal-environment
  SUBTITLE_ASR_ENGINE: ${SUBTITLE_ASR_ENGINE:-faster-whisper}
  SUBTITLE_WHISPER_MODEL: ${SUBTITLE_WHISPER_MODEL:-tiny}
  SUBTITLE_WHISPER_DEVICE: ${SUBTITLE_WHISPER_DEVICE:-cpu}
  SUBTITLE_WHISPER_COMPUTE_TYPE: ${SUBTITLE_WHISPER_COMPUTE_TYPE:-int8}
  SUBTITLE_WHISPER_MODEL_DIR: ${SUBTITLE_WHISPER_MODEL_DIR:-/models/whisper}
  SUBTITLE_WHISPER_CPU_THREADS: ${SUBTITLE_WHISPER_CPU_THREADS:-0}
  SUBTITLE_WHISPER_NUM_WORKERS: ${SUBTITLE_WHISPER_NUM_WORKERS:-1}
  CELERY_SUB_MAX_TASKS_PER_CHILD: ${CELERY_SUB_MAX_TASKS_PER_CHILD:-20}
  SUBTITLE_OPENVINO_MODEL: ${SUBTITLE_OPENVINO_MODEL:-}
  SUBTITLE_OPENVINO_DEVICE: ${SUBTITLE_OPENVINO_DEVICE:-GPU}
  SUBTITLE_OPENVINO_NUM_BEAMS: ${SUBTITLE_OPENVINO_NUM_BEAMS:-1}
  SUBTITLE_OPENVINO_MAX_NEW_TOKENS: ${SUBTITLE_OPENVINO_MAX_NEW_TOKENS:-448}
  SUBTITLE_GROQ_WHISPER_API_KEY: ${SUBTITLE_GROQ_WHISPER_API_KEY:-}
  SUBTITLE_GROQ_WHISPER_MODEL: ${SUBTITLE_GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
  SUBTITLE_CLOUDFLARE_ACCOUNT_ID: ${SUBTITLE_CLOUDFLARE_ACCOUNT_ID:-}
  SUBTITLE_CLOUDFLARE_API_KEY: ${SUBTITLE_CLOUDFLARE_API_KEY:-}
  SUBTITLE_CLOUDFLARE_MODEL: ${SUBTITLE_CLOUDFLARE_MODEL:-@cf/openai/whisper-large-v3-turbo}
  FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
  WORK_DIR: ${WORK_DIR:-/storage/work/videoroll}
  YOUTUBE_USER_AGENT: "${YOUTUBE_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36}"
  YOUTUBE_COOKIE_FILE: ${YOUTUBE_COOKIE_FILE:-}
  YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
  YOUTUBE_EXTRACTOR_ARGS_JSON: ${YOUTUBE_EXTRACTOR_ARGS_JSON:-}
  TASK_QUEUE_TICK_INTERVAL_SECONDS: ${TASK_QUEUE_TICK_INTERVAL_SECONDS:-10}
  HATCHET_SUBTITLE_WORKER_SLOTS: ${HATCHET_SUBTITLE_WORKER_SLOTS:-1}
  HATCHET_SUBTITLE_JOB_LEASE_TTL_SECONDS: ${HATCHET_SUBTITLE_JOB_LEASE_TTL_SECONDS:-300}
  SUBTITLE_DICTIONARY_DATA_DIR: ${SUBTITLE_DICTIONARY_DATA_DIR:-/storage/state/dictionaries}
  INTEL_GPU_RENDER_DEVICE: ${INTEL_GPU_RENDER_DEVICE:-/dev/dri/renderD128}

x-social-publisher-environment: &social-publisher-environment
  <<: *internal-environment
  SOCIAL_PUBLISH_WORK_DIR: ${SOCIAL_PUBLISH_WORK_DIR:-/storage/work/social-publisher}
  SAU_EXECUTABLE: ${SAU_EXECUTABLE:-sau}
  SAU_RUNTIME_DIR: ${SAU_RUNTIME_DIR:-/opt/social-auto-upload}
  SAU_COOKIES_DIR: ${SAU_COOKIES_DIR:-/opt/social-auto-upload/cookies}
  SAU_HEADLESS: ${SAU_HEADLESS:-true}
  DOUYIN_COOKIE_AUTH_HEADLESS: ${DOUYIN_COOKIE_AUTH_HEADLESS:-true}
  SAU_ACCOUNT_CHECK_TIMEOUT_SECONDS: ${SAU_ACCOUNT_CHECK_TIMEOUT_SECONDS:-120}
  SAU_UPLOAD_TIMEOUT_SECONDS: ${SAU_UPLOAD_TIMEOUT_SECONDS:-3600}
  SAU_OUTPUT_MAX_BYTES: ${SAU_OUTPUT_MAX_BYTES:-65536}
  SAU_LOCK_MARGIN_SECONDS: ${SAU_LOCK_MARGIN_SECONDS:-600}
  SOCIAL_LOGIN_TIMEOUT_SECONDS: ${SOCIAL_LOGIN_TIMEOUT_SECONDS:-900}
  SOCIAL_LOGIN_DISPLAY: ${SOCIAL_LOGIN_DISPLAY:-:99}
  SOCIAL_LOGIN_BROWSER_URL: "${SOCIAL_LOGIN_BROWSER_URL:-/social-login/vnc.html?autoconnect=1&resize=scale&path=/social-login/websockify}"

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ffplayout:
    build:
      context: ./services/ffplayout
      dockerfile: Dockerfile.videoroll
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-ffplayout:prod
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - ffplayout
      - --listen
      - 0.0.0.0:8787
      - --db
      - /var/lib/ffplayout/db/ffplayout.db
      - --log-to-console
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
    volumes:
      - ./data/ffplayout/db:/var/lib/ffplayout/db
      - ./data/ffplayout/logs:/var/lib/ffplayout/logs
      - ./data/ffplayout/playlists:/var/lib/ffplayout/playlists
      - ./data/ffplayout/public:/var/lib/ffplayout/public
      - ${STORAGE_HOST_ROOT:-./data/storage}/playout-media:/var/lib/ffplayout/media
    expose:
      - "8787"
    networks: [internal, playout-egress]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/setup >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  egress-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SUBTITLE: "0"
        INSTALL_ASR: "0"
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.8.19}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-egress:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.egress_gateway.main:app", "--host", "0.0.0.0", "--port", "8020"]
    environment:
      DEPLOYMENT_ROLE: egress-gateway
      DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?ADMIN_BOOTSTRAP_SECRET must be set}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  orchestrator:
    build: *core-build
    image: videoroll:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.orchestrator_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    environment:
      <<: *internal-environment
      DEPLOYMENT_ROLE: orchestrator
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-web}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SUBTITLE_SERVICE_URL: http://subtitle-service:8001
      YOUTUBE_INGEST_URL: http://youtube-ingest:8002
      BILIBILI_PUBLISHER_URL: http://bilibili-publisher:8003
      SOCIAL_PUBLISHER_URL: http://social-publisher-api:8010
      WORKFLOW_SERVICE_URL: http://workflow-api:8030
      WORK_DIR: ${WORK_DIR:-/storage/work/videoroll}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      PLAYOUT_MEDIA_ROOT: ${PLAYOUT_MEDIA_ROOT:-/storage/playout-media}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-}
      INTEL_GPU_RENDER_DEVICE: ${INTEL_GPU_RENDER_DEVICE:-/dev/dri/renderD128}
      YOUTUBE_USER_AGENT: "${YOUTUBE_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36}"
      YOUTUBE_COOKIE_FILE: ${YOUTUBE_COOKIE_FILE:-}
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
      YOUTUBE_EXTRACTOR_ARGS_JSON: ${YOUTUBE_EXTRACTOR_ARGS_JSON:-}
      STORAGE_CLEANUP_INTERVAL_SECONDS: ${STORAGE_CLEANUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
      subtitle-service:
        condition: service_healthy
      youtube-ingest:
        condition: service_healthy
      bilibili-publisher:
        condition: service_healthy
      social-publisher-api:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
    networks:
      internal:
        aliases: [app]
      platform-egress:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  subtitle-service:
    build: *subtitle-build
    image: videoroll-subtitle:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.subtitle_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *subtitle-environment
      DEPLOYMENT_ROLE: subtitle-api
    volumes:
      - ./data/models:/models
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
    networks: [internal, subtitle-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  youtube-ingest:
    build: *core-build
    image: videoroll:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.youtube_ingest.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *internal-environment
      DEPLOYMENT_ROLE: youtube-ingest-api
      YOUTUBE_USER_AGENT: "${YOUTUBE_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36}"
      YOUTUBE_PROXY: ${YOUTUBE_PROXY:-}
    volumes:
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  bilibili-publisher:
    build: *core-build
    image: videoroll:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.bilibili_publisher.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *internal-environment
      DEPLOYMENT_ROLE: bilibili-publisher-api
      BILIBILI_PUBLISH_MODE: ${BILIBILI_PUBLISH_MODE:-web}
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  hatchet-lite:
    build:
      context: ./services/hatchet
      dockerfile: Dockerfile.videoroll
      args:
        VERSION: ${HATCHET_VERSION:-v0.107.0}
    image: videoroll-hatchet:prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${HATCHET_DATABASE_URL:?HATCHET_DATABASE_URL must be set}
      LITE_FRONTEND_BASE_PATH: /workflow-ui
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-lite:7077
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-lite:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_INSECURE: "true"
      SERVER_URL: ${HATCHET_SERVER_URL:-http://localhost:3000}
      SERVER_FRONTEND_URL: ${HATCHET_FRONTEND_URL:-http://localhost:3000/workflow-ui/}
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-localhost}
      SERVER_AUTH_COOKIE_INSECURE: ${HATCHET_COOKIE_INSECURE:-true}
      SERVER_AUTH_SET_EMAIL_VERIFIED: "true"
      SERVER_SECURITY_CHECK_ENABLED: "false"
      SERVER_LOGGER_LEVEL: ${HATCHET_LOG_LEVEL:-warn}
    volumes:
      - hatchet-lite-config:/config
    expose:
      - "8888"
      - "7077"
    networks: [internal, infrastructure-egress]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8888/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  render-worker:
    build: *subtitle-build
    image: videoroll-subtitle:prod
    <<: *application-security
    command: ["python", "-m", "videoroll.apps.render_worker.runtime"]
    environment:
      RENDER_WORKER_SERVER_URL: ${RENDER_WORKER_SERVER_URL:-http://orchestrator:8000}
      RENDER_WORKER_ENROLLMENT_TOKEN: ${RENDER_WORKER_ENROLLMENT_TOKEN:-}
      RENDER_WORKER_CREDENTIAL: ${RENDER_WORKER_CREDENTIAL:-}
      RENDER_WORKER_CREDENTIAL_FILE: /state/credential
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-videoroll-development-internal-secret}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-videoroll-development-bootstrap-secret}
      RENDER_WORKER_KEY: ${RENDER_WORKER_KEY:-local-render}
      RENDER_WORKER_NAME: ${RENDER_WORKER_NAME:-本机渲染节点}
      RENDER_WORKER_BACKEND: ${RENDER_WORKER_BACKEND:-auto}
      RENDER_WORKER_GPU_DEVICE: ${RENDER_WORKER_GPU_DEVICE:-}
      RENDER_WORKER_MAX_CONCURRENCY: ${RENDER_WORKER_MAX_CONCURRENCY:-1}
      RENDER_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${RENDER_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      RENDER_WORKER_WORK_DIR: /work/render-worker
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
    volumes:
      - render-worker-state:/state
      - ${STORAGE_HOST_ROOT:-./data/storage}/render-worker-work:/work/render-worker
    depends_on:
      orchestrator:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  workflow-api:
    build:
      context: .
      dockerfile: docker/workflow.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-workflow:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.workflows.api:app", "--host", "0.0.0.0", "--port", "8030"]
    environment:
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-lite:8888}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      hatchet-lite:
        condition: service_healthy
    networks: [internal, infrastructure-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  workflow-worker:
    build:
      context: .
      dockerfile: docker/workflow.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-workflow:prod
    <<: *application-security
    command: ["python", "-m", "videoroll.workflows.worker"]
    environment:
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-lite:8888}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
      HATCHET_WORKER_NAME: ${HATCHET_WORKER_NAME:-videoroll-workflow-core-01}
      HATCHET_WORKER_SLOTS: ${HATCHET_WORKER_SLOTS:-4}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      orchestrator:
        condition: service_healthy
      hatchet-lite:
        condition: service_healthy
    networks: [internal, infrastructure-egress]
    restart: unless-stopped

  subtitle-workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SUBTITLE: "1"
        INSTALL_ASR: ${INSTALL_ASR:-1}
        INSTALL_HATCHET: "1"
        YTDLP_VERSION: ${YTDLP_VERSION:-latest}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-subtitle-workflow:prod
    <<: *application-security
    command: ["python", "-m", "videoroll.workflows.subtitle_worker"]
    environment:
      <<: *subtitle-environment
      DEPLOYMENT_ROLE: subtitle-workflow-worker
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-lite:8888}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
      HATCHET_SUBTITLE_WORKER_NAME: ${HATCHET_SUBTITLE_WORKER_NAME:-videoroll-subtitle-01}
      HATCHET_SUBTITLE_WORKER_SLOTS: ${HATCHET_SUBTITLE_WORKER_SLOTS:-1}
    volumes:
      - ./data/models:/models
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      orchestrator:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
      hatchet-lite:
        condition: service_healthy
    networks: [internal, subtitle-egress, infrastructure-egress]
    restart: unless-stopped

  subtitle-control-worker:
    build: *subtitle-build
    image: videoroll-subtitle:prod
    <<: *application-security
    command: ["celery", "-A", "videoroll.apps.subtitle_service.worker:celery_app", "worker", "-Q", "subtitle-control", "-l", "INFO", "--concurrency", "1"]
    environment:
      <<: *subtitle-environment
      DEPLOYMENT_ROLE: subtitle-control-worker
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
    networks: [internal, subtitle-egress]
    healthcheck:
      test: ["CMD-SHELL", "celery -A videoroll.apps.subtitle_service.worker:celery_app inspect ping --timeout=3 --destination=celery@$${HOSTNAME} | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  outbox-dispatcher:
    build: *core-build
    image: videoroll:prod
    <<: *application-security
    command: ["outbox-dispatcher"]
    environment:
      <<: *internal-environment
      DEPLOYMENT_ROLE: outbox-dispatcher
    volumes:
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
      subtitle-control-worker:
        condition: service_healthy
      publish-worker:
        condition: service_healthy
      social-publisher-worker:
        condition: service_healthy
    networks: [internal, infrastructure-egress]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/outbox-dispatcher-ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  publish-worker:
    build: *core-build
    image: videoroll:prod
    <<: *application-security
    command: ["celery", "-A", "videoroll.apps.bilibili_publisher.worker:celery_app", "worker", "-Q", "publish", "-l", "INFO", "--concurrency", "${CELERY_PUB_CONCURRENCY:-1}"]
    environment:
      <<: *internal-environment
      DEPLOYMENT_ROLE: publish-worker
      BILIBILI_PUBLISH_MODE: ${BILIBILI_PUBLISH_MODE:-web}
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD-SHELL", "celery -A videoroll.apps.bilibili_publisher.worker:celery_app inspect ping --timeout=3 --destination=celery@$${HOSTNAME} | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  social-publisher-api:
    build:
      context: .
      dockerfile: docker/social-publisher.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-social-publisher:prod
    <<: *application-security
    command: ["uvicorn", "videoroll.apps.social_publisher.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: *social-publisher-environment
      DEPLOYMENT_ROLE: social-publisher-api
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    tmpfs:
      - /opt/social-auto-upload/cookies:mode=0700,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
      - /dev/shm:mode=1777
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  social-publisher-worker:
    build:
      context: .
      dockerfile: docker/social-publisher.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-social-publisher:prod
    <<: *application-security
    command: ["celery", "-A", "videoroll.apps.social_publisher.worker:celery_app", "worker", "-Q", "social_publish", "-l", "INFO", "--concurrency", "${SOCIAL_PUBLISH_CONCURRENCY:-1}"]
    environment:
      <<: *social-publisher-environment
      DEPLOYMENT_ROLE: social-publisher-worker
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    tmpfs:
      - /opt/social-auto-upload/cookies:mode=0700,uid=${APP_UID:-10001},gid=${APP_GID:-10001}
      - /dev/shm:mode=1777
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD-SHELL", "celery -A videoroll.apps.social_publisher.worker:celery_app inspect ping --timeout=3 --destination=celery@$${HOSTNAME} | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  social-publisher-scheduler:
    build:
      context: .
      dockerfile: docker/social-publisher.Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: videoroll-social-publisher:prod
    <<: *application-security
    command: ["celery", "-A", "videoroll.apps.social_publisher.worker:celery_app", "beat", "-l", "INFO", "--schedule", "/tmp/social-celerybeat-schedule"]
    environment:
      <<: *social-publisher-environment
      DEPLOYMENT_ROLE: social-publisher-scheduler
    volumes:
      - ./data/secrets:/secrets
      - ${STORAGE_HOST_ROOT:-./data/storage}:/storage
    depends_on:
      redis:
        condition: service_healthy
      social-publisher-worker:
        condition: service_healthy
    networks: [internal, platform-egress]
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/social-celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      args:
        VITE_ORCHESTRATOR_URL: ${VITE_ORCHESTRATOR_URL:-}
        VITE_FFPLAYOUT_URL: ${VITE_FFPLAYOUT_URL:-}
        VITE_HATCHET_DASHBOARD_URL: ${VITE_HATCHET_DASHBOARD_URL:-}
    image: videoroll-web:prod
    environment:
      VIDEOROLL_PUBLIC_ORIGIN: ${VIDEOROLL_PUBLIC_ORIGIN:-http://localhost:3000}
      NGINX_ENVSUBST_FILTER: "VIDEOROLL_PUBLIC_ORIGIN"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:80"
    networks: [internal, web-ingress]
    depends_on:
      orchestrator:
        condition: service_healthy
      social-publisher-api:
        condition: service_healthy
      social-publisher-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  render-worker-state:
  hatchet-lite-config:

networks:
  internal:
    internal: true
  egress:
  subtitle-egress:
  platform-egress:
  playout-egress:
  infrastructure-egress:
  web-ingress:
